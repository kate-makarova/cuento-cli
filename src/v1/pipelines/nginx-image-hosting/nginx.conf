worker_processes auto;
pid /var/run/nginx-image-hosting.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx-image-hosting/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx-image-hosting/sites-enabled/*.conf;
}
